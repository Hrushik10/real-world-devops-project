name: DevOps E-Commerce CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Check application
        run: |
          python -m py_compile app/app.py

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t real-world-devops-app:${{ github.sha }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag real-world-devops-app:${{ github.sha }} hrushikreddy/real-world-devops-app:latest
          docker tag real-world-devops-app:${{ github.sha }} hrushikreddy/real-world-devops-app:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push hrushikreddy/real-world-devops-app:latest
          docker push hrushikreddy/real-world-devops-app:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
         host: ${{ secrets.EC2_HOST }}
         username: ${{ secrets.EC2_USERNAME }}
         key: ${{ secrets.EC2_SSH_KEY }}
         script: |
          cd /home/ubuntu
          chmod +x deploy.sh
          ./deploy.sh