<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOps E-Commerce Platform</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .products {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .product {
            background: white;
            padding: 20px;
            width: 250px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .status {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>DevOps E-Commerce Platform</h1>
    <p>Real-World DevOps Project</p>
</header>

<div class="container">

    <h2>Products</h2>

    <div class="products">

        <div class="product">
            <h3>💻 Laptop</h3>
            <p>Price: ₹55,000</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <h3>📱 Smartphone</h3>
            <p>Price: ₹25,000</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <h3>🎧 Headphones</h3>
            <p>Price: ₹2,000</p>
            <button>Add to Cart</button>
        </div>

    </div>

    <div class="status">
        <h3>Application Status</h3>
        <p>🟢 Application: Running</p>
        <p>Version: 1.0</p>
        <p>Environment: Local Development</p>
    </div>

</div>

</body>
</html>
